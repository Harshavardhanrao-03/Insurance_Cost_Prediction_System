<!DOCTYPE html>
<html>

<head>

    <title>Insurance Cost Predictor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-5 main-card">

        <h1 class="text-center mb-4 title">
            Insurance Cost Prediction
        </h1>

        <form action="/predict" method="POST">

            <input type="number"
                   name="age"
                   class="form-control mb-3"
                   placeholder="Age"
                   required>

            <select name="is_female"
                    class="form-control mb-3">

                <option value="1">Female</option>
                <option value="0">Male</option>

            </select>

            <input type="number"
                   step="0.1"
                   name="bmi"
                   class="form-control mb-3"
                   placeholder="BMI"
                   required>

            <input type="number"
                   name="children"
                   class="form-control mb-3"
                   placeholder="Children"
                   required>

            <select name="is_smoker"
                    class="form-control mb-3">

                <option value="1">Smoker</option>
                <option value="0">Non-Smoker</option>

            </select>

            <select name="region_southeast"
                    class="form-control mb-3">

                <option value="1">Southeast</option>
                <option value="0">Other Regions</option>

            </select>

            <select name="bmi_category_Obese"
                    class="form-control mb-3">

                <option value="1">Obese</option>
                <option value="0">Not Obese</option>

            </select>

            <button class="btn btn-primary w-100 predict-btn">
                Predict Insurance Cost
            </button>

        </form>

        <h3 class="text-center mt-4 result-text">
            {{ prediction_text }}
        </h3>

    </div>

</div>

</body>
</html>
